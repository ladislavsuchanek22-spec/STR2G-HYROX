[build]
  publish = "."
  # Při každém nasazení si web stáhne programy a ceny z appky Strong Coach a přegeneruje stránky
  # (i18n/app_store.py). Když API appky neodpoví, použije se uložený stav i18n/app_programs.json.
  command = "python3 i18n/build.py"

[build.environment]
  PYTHON_VERSION = "3.12"

# Zdrojáky serverových funkcí (STR2G Athletes) leží v publikované složce: nikdy je neservírovat jako soubory
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Gillette zatím nepublikovat: vrací 404
[[redirects]]
  from = "/gillette/*"
  to = "/404.html"
  status = 404
  force = true

# Old Netlify address -> main domain, so Google indexes only str2g.com
[[redirects]]
  from = "https://str2g-hyrox.netlify.app/*"
  to = "https://str2g.com/:splat"
  status = 301
  force = true

# /programs/ a /cs/programy/ jsou od 4. 11. vlastní stránky (rozcestník, i18n/hub.py)

# Bezpečnostní hlavičky pro celý web
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Ukázkové týdny (PDF) jsou výměnou za e-mail: nepouštět je do vyhledávačů
[[headers]]
  for = "/free-week/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
