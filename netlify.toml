[build]
  publish = "."
  command = ""

# Gillette project moved to hyrox-prague.eu/gillette/ (one strong domain instead of a netlify.app address)
[[redirects]]
  from = "https://gillette-clear-gel-hyrox.netlify.app/*"
  to = "https://hyrox-prague.eu/gillette/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/gillette/*"
  to = "https://hyrox-prague.eu/gillette/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/gillette"
  to = "https://hyrox-prague.eu/gillette/"
  status = 301
  force = true

# Old Netlify address -> main domain, so Google indexes only str2g.com
[[redirects]]
  from = "https://str2g-hyrox.netlify.app/*"
  to = "https://str2g.com/:splat"
  status = 301
  force = true
