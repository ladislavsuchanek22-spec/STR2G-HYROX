[build]
  publish = "."
  command = ""

# Gillette web: jen na vlastní adrese gillette-clear-gel-hyrox.netlify.app (na str2g.com dál 404)
[[redirects]]
  from = "https://gillette-clear-gel-hyrox.netlify.app/*"
  to = "/gcg/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://main--gillette-clear-gel-hyrox.netlify.app/*"
  to = "/gcg/:splat"
  status = 200
  force = true

# Gillette na str2g.com nepublikovat: vrací 404
[[redirects]]
  from = "https://str2g.com/gcg/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.str2g.com/gcg/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/gillette/*"
  to = "/404.html"
  status = 404
  force = true

# Old Netlify address -> main domain, so Google indexes only str2g.com
[[redirects]]
  from = "https://str2g-hyrox.netlify.app/*"
  to = "https://str2g.com/:splat"
  status = 301
  force = true
