[build]
  publish = "."
  command = ""

# Zdrojáky serverových funkcí (STR2G Athletes) leží v publikované složce: nikdy je neservírovat jako soubory
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Gillette zatím nepublikovat: vrací 404
[[redirects]]
  from = "/gillette/*"
  to = "/404.html"
  status = 404
  force = true

# Old Netlify address -> main domain, so Google indexes only str2g.com
[[redirects]]
  from = "https://str2g-hyrox.netlify.app/*"
  to = "https://str2g.com/:splat"
  status = 301
  force = true

# Rozcestníky programů nemají vlastní stránku -> přehled programů
[[redirects]]
  from = "/programs/"
  to = "/hyrox-training-plan/#pick"
  status = 301

[[redirects]]
  from = "/cs/programy/"
  to = "/cs/hyrox-treninkovy-plan/#pick"
  status = 301
