<!--STR2G_NEWSLETTER-->
<!--
  STR2G – vyskakovací okno pro odběr newsletteru (jméno + e-mail)
  - Otevře se po 25 s, po projetí 55 % stránky, nebo když myš na počítači odjede k zavírání záložky (nejdřív po 8 s).
  - Nikdy neskočí přes cookie lištu: počká, až ji člověk vyřeší.
  - Po zavření se 14 dní neukáže. Po přihlášení už nikdy.
  - Kontakty se ukládají do Netlify Forms (formulář "newsletter"). Když vyplníš MAILERLITE_URL, posílají se i do MailerLite.
  - Test: přidej ?nl=1 na konec adresy a okno se otevře hned.
  - Texty pro všechny jazyky jsou v TXT níže. Tenhle soubor se kopíruje do všech stránek přes i18n/build.py.
-->
<form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name"><input type="email" name="email"><input type="text" name="lang"><input type="text" name="page"><input type="text" name="bot-field">
</form>
<style>
#nl{position:fixed;inset:0;z-index:99990;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);opacity:0;transition:opacity .25s}
#nl.on{opacity:1}
#nl .nl-box{position:relative;display:grid;grid-template-columns:minmax(0,300px) minmax(0,420px);background:#0F0F0E;border:1px solid #262521;color:#fff;max-height:calc(100vh - 40px);overflow:auto;transform:translateY(16px);transition:transform .25s}
#nl.on .nl-box{transform:none}
#nl .nl-img{background:#050505 url(/img/lada-ria-race-day.webp) center 30%/cover;min-height:100%}
#nl .nl-body{padding:34px 32px 28px}
#nl .nl-eb{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C9A950;margin:0 0 14px}
#nl h2{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:900;font-style:italic;text-transform:uppercase;font-size:44px;line-height:.9;margin:0 0 14px;text-wrap:balance}
#nl p.nl-t{color:#C9C6BE;font-size:15.5px;line-height:1.5;margin:0 0 20px}
#nl label{display:block;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9A978F;margin:0 0 6px}
#nl input{display:block;width:100%;background:#050505;border:1px solid #3a3833;color:#fff;font:16px/1.3 "Archivo","Helvetica Neue",Arial,sans-serif;padding:13px 14px;margin:0 0 14px;border-radius:0;-webkit-appearance:none;appearance:none}
#nl input:focus{outline:none;border-color:#C9A950}
#nl .nl-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#nl button.nl-go{width:100%;background:#C9A950;color:#050505;border:1.5px solid #C9A950;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;font-size:21px;letter-spacing:.02em;padding:13px 20px 12px;cursor:pointer;margin-top:4px}
#nl button.nl-go:hover{background:#fff;border-color:#fff}
#nl button.nl-go[disabled]{opacity:.6;cursor:wait}
#nl .nl-legal{font-size:12px;line-height:1.45;color:#7d7a73;margin:14px 0 0}
#nl .nl-legal a{color:#9A978F}
#nl .nl-legal a:hover{color:#fff}
#nl .nl-err{color:#ff8a7a;font-size:13.5px;margin:10px 0 0;min-height:0}
#nl .nl-x{position:absolute;top:8px;right:8px;width:40px;height:40px;background:transparent;border:0;color:#9A978F;font-size:26px;line-height:1;cursor:pointer;z-index:2}
#nl .nl-x:hover{color:#fff}
#nl button:focus-visible,#nl input:focus-visible{outline:2px solid #C9A950;outline-offset:2px}
@media (max-width:720px){
  #nl{align-items:flex-end;padding:0}
  #nl .nl-box{grid-template-columns:1fr;width:100%;max-height:92vh;border-left:0;border-right:0;border-bottom:0;transform:translateY(100%)}
  #nl .nl-img{display:none}
  #nl .nl-body{padding:28px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px))}
  #nl h2{font-size:38px;padding-right:30px}
}
@media (prefers-reduced-motion:reduce){#nl,#nl .nl-box{transition:none}}
</style>
<script>
(function () {
  var CFG = {
    // MailerLite formulář „STR2G web“. Prázdné = ukládá se jen do Netlify.
    MAILERLITE_URL: 'https://assets.mailerlite.com/jsonp/2721571/forms/201638923122771811/subscribe',
    DELAY_MS: 25000,
    SCROLL_RATIO: 0.55,
    SNOOZE_DAYS: 14,
    IMAGE: '/img/lada-ria-race-day.webp'
  };
  var TXT = {
    en: { eb: 'STR2G Newsletter', h: 'Train smarter for HYROX.', t: 'Practical tips straight from our coaching. Running, stations, pacing, race strategy. Plus new programs and discounts before anyone else.', n: 'First name', e: 'Email', b: 'Sign me up', l: 'No spam. Unsubscribe anytime with one click. We only use your email for the STR2G newsletter.', okh: "You're in.", okt: 'Thanks. Your first email is on the way soon.', err: 'Something went wrong. Try again in a minute.', p: 'Privacy policy', x: 'Close' },
    cs: { eb: 'STR2G Newsletter', h: 'Trénuj na HYROX chytřeji.', t: 'Praktické tipy přímo z naší trenérské praxe. Běh, stanice, tempo, taktika na závod. A nové programy a slevy uvidíš jako první.', n: 'Křestní jméno', e: 'E-mail', b: 'Chci odebírat', l: 'Žádný spam. Odhlásit se můžeš kdykoliv jedním klikem. E-mail použijeme jen pro STR2G newsletter.', okh: 'Jsi tam.', okt: 'Díky. První e-mail ti brzy dorazí.', err: 'Něco se pokazilo. Zkus to za chvíli znovu.', p: 'Ochrana osobních údajů', x: 'Zavřít' },
    sk: { eb: 'STR2G Newsletter', h: 'Trénuj na HYROX múdrejšie.', t: 'Praktické tipy priamo z našej trénerskej praxe. Beh, stanice, tempo, taktika na pretek. A nové programy a zľavy uvidíš ako prvý.', n: 'Krstné meno', e: 'E-mail', b: 'Chcem odoberať', l: 'Žiadny spam. Odhlásiť sa môžeš kedykoľvek jedným klikom. E-mail použijeme len pre STR2G newsletter.', okh: 'Si tam.', okt: 'Vďaka. Prvý e-mail ti čoskoro príde.', err: 'Niečo sa pokazilo. Skús to o chvíľu znova.', p: 'Ochrana osobných údajov', x: 'Zavrieť' },
    de: { eb: 'STR2G Newsletter', h: 'Trainier smarter für HYROX.', t: 'Praxistipps direkt aus unserem Coaching. Laufen, Stationen, Pacing, Rennstrategie. Dazu neue Programme und Rabatte vor allen anderen.', n: 'Vorname', e: 'E-Mail', b: 'Jetzt anmelden', l: 'Kein Spam. Abmeldung jederzeit mit einem Klick. Deine E-Mail nutzen wir nur für den STR2G Newsletter.', okh: 'Du bist dabei.', okt: 'Danke. Deine erste E-Mail kommt bald.', err: 'Etwas ist schiefgelaufen. Versuch es gleich nochmal.', p: 'Datenschutz', x: 'Schließen' },
    pl: { eb: 'STR2G Newsletter', h: 'Trenuj HYROX mądrzej.', t: 'Praktyczne wskazówki prosto z naszej pracy trenerskiej. Bieganie, stacje, tempo, taktyka na zawody. Do tego nowe programy i zniżki jako pierwszy.', n: 'Imię', e: 'E-mail', b: 'Zapisuję się', l: 'Zero spamu. Wypiszesz się w każdej chwili jednym kliknięciem. Twój e-mail wykorzystamy tylko do newslettera STR2G.', okh: 'Jesteś z nami.', okt: 'Dzięki. Pierwszy e-mail wkrótce do Ciebie dotrze.', err: 'Coś poszło nie tak. Spróbuj ponownie za chwilę.', p: 'Polityka prywatności', x: 'Zamknij' },
    fr: { eb: 'Newsletter STR2G', h: 'Entraîne-toi plus malin pour HYROX.', t: 'Des conseils concrets tirés de notre coaching. Course, stations, allure, stratégie de course. Et les nouveaux programmes et promos avant tout le monde.', n: 'Prénom', e: 'E-mail', b: 'Je m’inscris', l: 'Pas de spam. Désinscription en un clic à tout moment. Ton e-mail sert uniquement à la newsletter STR2G.', okh: 'C’est fait.', okt: 'Merci. Ton premier e-mail arrive bientôt.', err: 'Un problème est survenu. Réessaie dans une minute.', p: 'Confidentialité', x: 'Fermer' },
    es: { eb: 'Newsletter STR2G', h: 'Entrena HYROX con cabeza.', t: 'Consejos prácticos sacados de nuestro coaching. Carrera, estaciones, ritmo y estrategia de competición. Y los nuevos programas y descuentos antes que nadie.', n: 'Nombre', e: 'Email', b: 'Quiero apuntarme', l: 'Cero spam. Date de baja cuando quieras con un clic. Solo usamos tu email para la newsletter de STR2G.', okh: 'Ya estás dentro.', okt: 'Gracias. Tu primer email llegará pronto.', err: 'Algo ha fallado. Inténtalo de nuevo en un minuto.', p: 'Privacidad', x: 'Cerrar' },
    it: { eb: 'Newsletter STR2G', h: 'Allenati per HYROX con più testa.', t: 'Consigli pratici direttamente dal nostro coaching. Corsa, stazioni, ritmo, strategia di gara. E i nuovi programmi e gli sconti prima di tutti.', n: 'Nome', e: 'Email', b: 'Mi iscrivo', l: 'Niente spam. Ti disiscrivi quando vuoi con un clic. Usiamo la tua email solo per la newsletter STR2G.', okh: 'Ci sei.', okt: 'Grazie. La tua prima email arriva presto.', err: 'Qualcosa è andato storto. Riprova tra un minuto.', p: 'Privacy', x: 'Chiudi' },
    nl: { eb: 'STR2G Nieuwsbrief', h: 'Train slimmer voor HYROX.', t: 'Praktische tips rechtstreeks uit onze coaching. Lopen, stations, pacing, racestrategie. Plus nieuwe programma’s en kortingen als eerste.', n: 'Voornaam', e: 'E-mail', b: 'Schrijf me in', l: 'Geen spam. Uitschrijven kan altijd met één klik. We gebruiken je e-mail alleen voor de STR2G nieuwsbrief.', okh: 'Je bent erbij.', okt: 'Bedankt. Je eerste e-mail komt eraan.', err: 'Er ging iets mis. Probeer het zo opnieuw.', p: 'Privacybeleid', x: 'Sluiten' }
  };

  var K_DONE = 'str2g_nl_done', K_SNOOZE = 'str2g_nl_snooze';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var force = /[?&]nl=1\b/.test(location.search);
  if (!force) {
    if (get(K_DONE)) return;
    var s = parseInt(get(K_SNOOZE) || '0', 10);
    if (s && Date.now() - s < CFG.SNOOZE_DAYS * 864e5) return;
  }

  var lang = (document.documentElement.lang || 'en').slice(0, 2).toLowerCase();
  var t = TXT[lang] || TXT.en;
  var PRIV = (lang === 'cs' || lang === 'sk') ? '/cs/ochrana-osobnich-udaju/' : '/privacy/';
  var shown = false, pending = false, root, lastFocus;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function build() {
    root = document.createElement('div');
    root.id = 'nl';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'true');
    root.setAttribute('aria-labelledby', 'nl-h');
    root.innerHTML =
      '<div class="nl-box">' +
        '<div class="nl-img" style="background-image:url(' + CFG.IMAGE + ')" aria-hidden="true"></div>' +
        '<div class="nl-body">' +
          '<button type="button" class="nl-x" aria-label="' + esc(t.x) + '">&times;</button>' +
          '<p class="nl-eb">' + esc(t.eb) + '</p>' +
          '<h2 id="nl-h">' + esc(t.h) + '</h2>' +
          '<p class="nl-t">' + esc(t.t) + '</p>' +
          '<form novalidate>' +
            '<label for="nl-n">' + esc(t.n) + '</label><input id="nl-n" name="name" type="text" autocomplete="given-name" required>' +
            '<label for="nl-e">' + esc(t.e) + '</label><input id="nl-e" name="email" type="email" autocomplete="email" inputmode="email" required>' +
            '<div class="nl-hp" aria-hidden="true"><input name="bot-field" tabindex="-1" autocomplete="off"></div>' +
            '<button type="submit" class="nl-go">' + esc(t.b) + '</button>' +
            '<p class="nl-err" role="alert"></p>' +
            '<p class="nl-legal">' + esc(t.l) + ' <a href="' + PRIV + '" target="_blank" rel="noopener">' + esc(t.p) + '</a></p>' +
          '</form>' +
        '</div>' +
      '</div>';
    document.body.appendChild(root);
    root.querySelector('.nl-x').onclick = close;
    root.addEventListener('click', function (e) { if (e.target === root) close(); });
    document.addEventListener('keydown', onKey);
    root.querySelector('form').addEventListener('submit', submit);
  }

  function onKey(e) {
    if (!root) return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key === 'Tab') {
      var f = root.querySelectorAll('button, input:not([tabindex="-1"])');
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  function open() {
    if (shown) return;
    if (document.getElementById('str2g-consent')) { pending = true; return; }
    shown = true;
    cleanup();
    lastFocus = document.activeElement;
    build();
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.add('on'); }); });
    if (window.matchMedia('(min-width:721px)').matches) setTimeout(function () { var n = root && root.querySelector('#nl-n'); if (n) n.focus(); }, 260);
    else { var x = root.querySelector('.nl-x'); x.focus({ preventScroll: true }); }
  }

  function close() {
    if (!root) return;
    if (!get(K_DONE)) set(K_SNOOZE, String(Date.now()));
    root.classList.remove('on');
    document.removeEventListener('keydown', onKey);
    var r = root; root = null;
    setTimeout(function () { r.remove(); }, 260);
    if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
  }

  function enc(o) { return Object.keys(o).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(o[k]); }).join('&'); }

  function submit(e) {
    e.preventDefault();
    var f = e.target, btn = f.querySelector('.nl-go'), err = f.querySelector('.nl-err');
    var name = f.name.value.trim(), email = f.email.value.trim();
    err.textContent = '';
    if (!name) { f.name.focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { f.email.focus(); return; }
    if (f['bot-field'].value) return;
    btn.disabled = true;
    var data = { 'form-name': 'newsletter', name: name, email: email, lang: lang, page: location.pathname };
    var jobs = [fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: enc(data) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); })];
    if (CFG.MAILERLITE_URL) {
      jobs.push(fetch(CFG.MAILERLITE_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: enc({ 'fields[email]': email, 'fields[name]': name, 'ml-submit': '1', 'anticsrf': 'true' }) }).catch(function () {}));
    }
    Promise.all(jobs).then(function () {
      set(K_DONE, '1');
      if (window.str2gLead) window.str2gLead('newsletter');
      var body = root.querySelector('.nl-body');
      body.innerHTML = '<button type="button" class="nl-x" aria-label="' + esc(t.x) + '">&times;</button>' +
        '<p class="nl-eb">' + esc(t.eb) + '</p><h2 id="nl-h">' + esc(t.okh) + '</h2><p class="nl-t" style="margin:0">' + esc(t.okt) + '</p>';
      body.querySelector('.nl-x').onclick = close;
      body.querySelector('.nl-x').focus();
    }).catch(function () {
      btn.disabled = false;
      err.textContent = t.err;
    });
  }

  // Spouštěče
  var timer;
  function onScroll() {
    var h = document.documentElement.scrollHeight - innerHeight;
    if (h > 0 && scrollY / h >= CFG.SCROLL_RATIO) open();
  }
  function onLeave(e) { if (e.clientY <= 0 && !e.relatedTarget) open(); }
  function cleanup() {
    clearTimeout(timer);
    removeEventListener('scroll', onScroll);
    document.removeEventListener('mouseout', onLeave);
  }

  // Až zmizí cookie lišta, otevři odložené okno
  new MutationObserver(function () {
    if (pending && !document.getElementById('str2g-consent')) { pending = false; setTimeout(open, 1200); }
  }).observe(document.body, { childList: true });

  function start() {
    if (force) { setTimeout(open, 600); return; }
    timer = setTimeout(open, CFG.DELAY_MS);
    addEventListener('scroll', onScroll, { passive: true });
    if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
      setTimeout(function () { document.addEventListener('mouseout', onLeave); }, 8000);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<!--/STR2G_NEWSLETTER-->
