<!--
  STR2G – měření pro reklamu
  Co to dělá:
  1) Cookie lišta (souhlas / odmítnutí) – bez souhlasu se Meta Pixel vůbec nenačte.
  2) Google tag (GA4 + Google Ads) v režimu Consent Mode v2 – před souhlasem nic neukládá.
  3) Každý klik na platební odkaz do Strivee = InitiateCheckout (Meta) + begin_checkout (GA4) + konverze (Google Ads), včetně názvu programu a ceny.
  4) Funkce window.str2gLead('kviz') pro budoucí kvíz / formulář = Lead (Meta) + generate_lead (GA4) + konverze (Ads).
  5) window.str2gConsentReset() znovu otevře cookie lištu.
-->
<script>
(function () {
  var CFG = {
    META_PIXEL_ID: '1343098769871797',
    GA4_ID: 'G-P21WD6TY8N',
    ADS_ID: 'AW-11061084387',
    ADS_CHECKOUT_LABEL: 'lFZiCPf0iZ8dEOOBq5op',
    ADS_LEAD_LABEL: 'xPRgCPr0iZ8dEOOBq5op'
  };

  var KEY = 'str2g_consent';
  function getConsent() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function setConsent(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function has(id) { return id && id.indexOf('DOPLNIT') === -1; }

  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = window.gtag || gtag;
  gtag('consent', 'default', {
    ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied',
    analytics_storage: 'denied', wait_for_update: 500
  });
  gtag('js', new Date());
  if (has(CFG.GA4_ID)) gtag('config', CFG.GA4_ID);
  if (has(CFG.ADS_ID)) gtag('config', CFG.ADS_ID);
  var firstId = has(CFG.GA4_ID) ? CFG.GA4_ID : (has(CFG.ADS_ID) ? CFG.ADS_ID : null);
  if (firstId) {
    var gs = document.createElement('script');
    gs.async = true;
    gs.src = 'https://www.googletagmanager.com/gtag/js?id=' + firstId;
    document.head.appendChild(gs);
  }

  var metaLoaded = false;
  function loadMeta() {
    if (metaLoaded || !has(CFG.META_PIXEL_ID)) return;
    metaLoaded = true;
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
      t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
    }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', CFG.META_PIXEL_ID);
    window.fbq('track', 'PageView');
  }

  function grant() {
    gtag('consent', 'update', {
      ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted'
    });
    loadMeta();
  }
  function granted() { return getConsent() === 'yes'; }
  if (granted()) grant();

  function programInfo(a) {
    var name = a.getAttribute('data-program') || '';
    var value = parseInt(a.getAttribute('data-value') || '0', 10) || 0;
    if (name && value) return { name: name, value: value };
    var el = a;
    for (var i = 0; i < 8 && el; i++) {
      el = el.parentElement;
      if (!el || !el.querySelector) continue;
      var h = el.querySelector('h3, h4');
      if (h) {
        if (!name) name = h.textContent.replace(/\s+/g, ' ').trim();
        if (!value) {
          var t = el.textContent;
          var m = t.match(/CZK\s*([\d][\d.,\u00a0 ]*\d|\d)/) || t.match(/(\d[\d.,\u00a0 ]*\d|\d)\s*Kč/);
          if (m) value = parseInt(m[1].replace(/[^\d]/g, ''), 10) || 0;
        }
        break;
      }
    }
    return { name: name || 'STR2G program', value: value };
  }

  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href*="train.strivee.app/payment"]') : null;
    if (!a) return;
    var p = programInfo(a);

    gtag('event', 'begin_checkout', { currency: 'CZK', value: p.value, items: [{ item_name: p.name, price: p.value }] });
    if (has(CFG.ADS_ID) && has(CFG.ADS_CHECKOUT_LABEL)) {
      gtag('event', 'conversion', { send_to: CFG.ADS_ID + '/' + CFG.ADS_CHECKOUT_LABEL, value: p.value, currency: 'CZK' });
    }
    if (granted() && window.fbq) {
      window.fbq('track', 'InitiateCheckout', { content_name: p.name, value: p.value, currency: 'CZK' });
    }

    var newTab = a.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1;
    if (!newTab) {
      e.preventDefault();
      setTimeout(function () { window.location.href = a.href; }, 300);
    }
  }, true);

  window.str2gLead = function (source) {
    gtag('event', 'generate_lead', { lead_source: source || 'web' });
    if (has(CFG.ADS_ID) && has(CFG.ADS_LEAD_LABEL)) {
      gtag('event', 'conversion', { send_to: CFG.ADS_ID + '/' + CFG.ADS_LEAD_LABEL });
    }
    if (granted() && window.fbq) window.fbq('track', 'Lead', { content_name: source || 'web' });
  };

  var TXT = {
    en: ['We use cookies to measure the site and show you relevant ads. Only with your consent.', 'Accept', 'Reject'],
    cs: ['Používáme cookies na měření webu a zobrazení relevantní reklamy. Jen s tvým souhlasem.', 'Souhlasím', 'Odmítnout'],
    de: ['Wir nutzen Cookies, um die Website zu messen und dir relevante Werbung zu zeigen. Nur mit deiner Zustimmung.', 'Akzeptieren', 'Ablehnen'],
    pl: ['Używamy plików cookie do pomiaru strony i wyświetlania trafnych reklam. Tylko za Twoją zgodą.', 'Akceptuję', 'Odrzuć'],
    sk: ['Používame cookies na meranie webu a zobrazenie relevantnej reklamy. Len s tvojím súhlasom.', 'Súhlasím', 'Odmietnuť'],
    fr: ['Nous utilisons des cookies pour mesurer le site et te montrer des publicités pertinentes. Uniquement avec ton accord.', 'Accepter', 'Refuser'],
    es: ['Usamos cookies para medir la web y mostrarte publicidad relevante. Solo con tu consentimiento.', 'Aceptar', 'Rechazar'],
    it: ['Usiamo i cookie per misurare il sito e mostrarti pubblicità pertinente. Solo con il tuo consenso.', 'Accetto', 'Rifiuta'],
    nl: ['We gebruiken cookies om de site te meten en je relevante advertenties te tonen. Alleen met je toestemming.', 'Accepteren', 'Weigeren']
  };

  function showBanner() {
    if (document.getElementById('str2g-consent')) return;
    var lang = (document.documentElement.lang || 'en').slice(0, 2).toLowerCase();
    var t = TXT[lang] || TXT.en;
    var box = document.createElement('div');
    box.id = 'str2g-consent';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-live', 'polite');
    box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;max-width:560px;margin:0 auto;' +
      'background:#0d0d0d;color:#f2f2f2;border:1px solid #2a2a2a;border-radius:12px;padding:16px;' +
      'font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4)';
    var p = document.createElement('p');
    p.style.cssText = 'margin:0 0 12px';
    p.textContent = t[0];
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
    function btn(label, primary, fn) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.style.cssText = 'flex:1 1 120px;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;' +
        (primary ? 'background:#C9A950;color:#050505;border:1px solid #C9A950' : 'background:transparent;color:#f2f2f2;border:1px solid #f2f2f2');
      b.onclick = fn;
      return b;
    }
    row.appendChild(btn(t[1], true, function () { setConsent('yes'); grant(); box.remove(); }));
    row.appendChild(btn(t[2], false, function () { setConsent('no'); box.remove(); }));
    box.appendChild(p);
    box.appendChild(row);
    document.body.appendChild(box);
  }

  window.str2gConsentReset = function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    showBanner();
  };

  if (!getConsent()) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showBanner);
    else showBanner();
  }
})();
</script>
