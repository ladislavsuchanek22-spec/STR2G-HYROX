  2) Google tag (GA4 + Google Ads) v režimu Consent Mode v2 – před souhlasem nic neukládá.
  3) Každý klik na platební odkaz do Strivee (u odkazů na vlastní /storefront/ jen select_item, checkout hlásí storefront) = InitiateCheckout (Meta) + begin_checkout (GA4) + konverze (Google Ads), včetně názvu programu a ceny.
  4) Funkce window.str2gLead('kviz') pro budoucí kvíz / formulář = Lead (Meta) + generate_lead (GA4) + konverze (Ads).
  5) window.str2gConsentReset() znovu otevře cookie lištu.
  6) Tanganica pixel (Google Tag Manager GTM-TRS5RSN) je na konci tohoto souboru doslova podle Tanganica, aby ho
     jejich kontrola našla. Načítá se až po nastavení Consent Mode (vše denied), takže do souhlasu neukládá cookies.
-->

  function programInfo(a) {
    var name = a.getAttribute('data-program') || '';
    var value = parseInt(a.getAttribute('data-value') || '0', 10) || 0;
    if (name && value) return { name: name, value: value };
    var el = a;
    for (var i = 0; i < 8 && el; i++) {
      el = el.parentElement;
      if (!el || !el.querySelector) continue;
      var h = el.querySelector('h3, h4');
      if (h) {
        if (!name) name = h.textContent.replace(/\s+/g, ' ').trim();
        if (!value) {
          var t = el.textContent;
          var m = t.match(/CZK\s*([\d][\d.,\u00a0 ]*\d|\d)/) || t.match(/(\d[\d.,\u00a0 ]*\d|\d)\s*Kč/);
          if (m) value = parseInt(m[1].replace(/[^\d]/g, ''), 10) || 0;

    }
    return { name: name || 'STR2G program', value: value };

  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href*="train.strivee.app/payment"], a[href*="/storefront/?program="]') : null;
    if (!a) return;

    // Odkaz na vlastní storefront: výběr programu. Samotný begin_checkout / InitiateCheckout pošle
    // storefront až při kliku na Koupit, aby se nepočítal dvakrát.
    var toStore = a.href.indexOf('/storefront/') !== -1;
    if (toStore) {
      window.dataLayer.push({ ecommerce: null });
      window.dataLayer.push({ event: 'select_item', ecommerce: { currency: 'CZK', value: p.value, items: [{ item_name: p.name, price: p.value, quantity: 1 }] } });
      gtag('event', 'select_item', { items: [{ item_name: p.name, price: p.value }] });
      if (granted() && window.fbq) window.fbq('track', 'ViewContent', { content_name: p.name, value: p.value, currency: 'CZK' });

    window.dataLayer.push({ ecommerce: null });

    gtag('event', 'begin_checkout', { currency: 'CZK', value: p.value, items: [{ item_name: p.name, price: p.value }] });
    if (has(CFG.ADS_ID) && has(CFG.ADS_CHECKOUT_LABEL)) {

    if (granted() && window.fbq) {
      window.fbq('track', 'InitiateCheckout', { content_name: p.name, value: p.value, currency: 'CZK' });
    }
    // Anonymous first-party count (no cookies, no IDs) – also for visitors without consent.
    try {
      var q = location.search, r = document.referrer || '';

        : /[?&](gclid|gbraid|wbraid)=|[?&]utm_source=google\b/i.test(q) || /google\./i.test(r) ? 'google'
        : r && r.indexOf(location.host) === -1 ? 'other' : 'direct';
      var body = JSON.stringify({ p: p.name, l: (document.documentElement.lang || '').slice(0, 2), src: src, c: granted() ? 1 : 0 });
      if (navigator.sendBeacon) navigator.sendBeacon('/api/checkout-click', new Blob([body], { type: 'text/plain' }));
    } catch (err) {}

    // Cmd/Ctrl/Shift/middle click: leave it to the browser, this page stays open.
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    // Instagram/Facebook in-app browsers open target=_blank in the SAME window,
    // which kills the Meta/Google requests above before they leave. There (and for
    // same-tab links) wait a moment so the events get sent, then go to Strivee.
    var inApp = /FBAN|FBAV|FB_IAB|FBIOS|Instagram/i.test(navigator.userAgent || '');
    if (a.target !== '_blank' || inApp) {
      e.preventDefault();
      setTimeout(function () { window.location.href = a.href; }, 400);
    }
  }, true);

  window.str2gLead = function (source) {
    gtag('event', 'generate_lead', { lead_source: source || 'web' });
    if (has(CFG.ADS_ID) && has(CFG.ADS_LEAD_LABEL)) {

    fr: ['Nous utilisons des cookies pour mesurer le site et te montrer des publicités pertinentes. Uniquement avec ton accord.', 'Accepter', 'Refuser'],
    es: ['Usamos cookies para medir la web y mostrarte publicidad relevante. Solo con tu consentimiento.', 'Aceptar', 'Rechazar'],
    it: ['Usiamo i cookie per misurare il sito e mostrarti pubblicità pertinente. Solo con il tuo consenso.', 'Accetto', 'Rifiuta'],
    nl: ['We gebruiken cookies om de site te meten en je relevante advertenties te tonen. Alleen met je toestemming.', 'Accepteren', 'Weigeren']
  };

  function showBanner() {
    if (document.getElementById('str2g-consent')) return;
    var lang = (document.documentElement.lang || 'en').slice(0, 2).toLowerCase();
    var t = TXT[lang] || TXT.en;

  var saved = null; try { saved = localStorage.getItem('str2g-sf-lang'); } catch (e) {}
  var nav = (navigator.language || '').toLowerCase();
  var lang = qs.get('lang') === 'en' || qs.get('lang') === 'cs' ? qs.get('lang') : saved || (/^(cs|sk)/.test(nav) ? 'cs' : 'en');
  try { localStorage.setItem('str2g-lang', lang); } catch (e) {}
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(function (n) { var v = T[lang][n.getAttribute('data-t')]; if (v) n.textContent = v; });
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    b.addEventListener('click', function () {
      var l = b.getAttribute('data-lang'); if (l === lang) return;
      try { localStorage.setItem('str2g-sf-lang', l); localStorage.setItem('str2g-lang', l); } catch (e) {}
      var u = new URL(location.href); u.searchParams.delete('lang'); location.href = u.toString();
    });
  });

  // Nákup dokončen: Stripe vrátí zákazníka sem s ?platba=ok. Program a cenu si pamatujeme z kliku na Koupit.
  try {
    var pend = JSON.parse(sessionStorage.getItem('str2g-pending') || 'null');
    if (qs.get('platba') === 'ok' && pend && pend.value && Date.now() - pend.t < 6 * 3600e3) {
      sessionStorage.removeItem('str2g-pending');
      var tid = 'sf-' + pend.t;
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ ecommerce: null });
      window.dataLayer.push({ event: 'purchase', ecommerce: { transaction_id: tid, currency: 'CZK', value: pend.value, items: [{ item_name: pend.name, price: pend.value, quantity: 1 }] } });
      if (window.gtag) window.gtag('event', 'purchase', { transaction_id: tid, currency: 'CZK', value: pend.value, items: [{ item_name: pend.name, price: pend.value }] });
      var fire = function () { if (window.fbq) window.fbq('track', 'Purchase', { content_name: pend.name, value: pend.value, currency: 'CZK' }); };
      if (window.fbq) fire(); else setTimeout(fire, 1500);
    }
  } catch (err) {}

  // Měření: storefront z appky při kliknutí na Koupit pošle událost str2g:checkout
  document.addEventListener('str2g:checkout', function (e) {
    var p = e.detail || {}, value = p.value || 0;
    try { sessionStorage.setItem('str2g-pending', JSON.stringify({ name: p.name, value: value, t: Date.now() })); } catch (err) {}
    try {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ ecommerce: null });
      window.dataLayer.push({ event: 'begin_checkout', ecommerce: { currency: 'CZK', value: value, items: [{ item_name: p.name, price: value, quantity: 1 }] } });
      if (window.gtag) window.gtag('event', 'begin_checkout', { currency: 'CZK', value: value, items: [{ item_name: p.name, price: value }] });
      if (window.fbq) window.fbq('track', 'InitiateCheckout', { content_name: p.name, value: value, currency: 'CZK' });
      if (navigator.sendBeacon) navigator.sendBeacon('/api/checkout-click', new Blob([JSON.stringify({ p: p.name, l: lang, src: 'storefront', c: window.fbq ? 1 : 0 })], { type: 'text/plain' }));
    } catch (err) {}
  });
})();
</script>
<script src="https://app.str2g.com/embed/storefront.js" defer></script>
